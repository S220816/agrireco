# Tests de la partie B (pipeline) à chaque push / pull request touchant le pipeline.
# Ne déploie rien : le déploiement est géré par le workflow de la partie C.
name: pipeline-tests
on:
  push:
    paths: ["functions/**", "samples/**", ".github/workflows/pipeline-tests.yml"]
  pull_request:
    paths: ["functions/**", "samples/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r functions/requirements.txt pytest
      - run: python -m pytest -q functions/tests
