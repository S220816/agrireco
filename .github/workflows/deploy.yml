name: deploy
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
permissions:
  id-token: write
  contents: read
env:
  EQ: agrinb27
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Connexion a Azure (OIDC, sans mot de passe)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Mettre a jour l'API (Container Apps)
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          az containerapp update -n api-$EQ -g rg-projet-$EQ \
            --image ghcr.io/$REPO/api:${{ github.event.workflow_run.head_sha }}
          az containerapp ingress update -n api-$EQ -g rg-projet-$EQ --target-port 8000
      - name: Deployer les fonctions (Function App)
        if: hashFiles('functions/function_app.py') != ''
        uses: Azure/functions-action@v1
        with:
          app-name: func-${{ env.EQ }}
          package: functions
          sku: flexconsumption
          remote-build: true
